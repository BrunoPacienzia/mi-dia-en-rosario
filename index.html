<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi día en Rosario</title>
<meta name="description" content="Prototipo de súper-app ciudadana para Rosario: lo que hay a tu alrededor, movilidad en tiempo real y reclamos colaborativos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Layout: mapa a pantalla completa; barra superior flotante; hoja inferior deslizable (en escritorio, panel lateral izquierdo). */
:root{
  --bg:#eef1f2; --surface:#ffffff; --surface-2:#f4f6f7; --ink:#14222b; --ink-2:#4b5b66; --line:#d9e0e4;
  --celeste:#2a86c4; --celeste-ink:#ffffff; --celeste-soft:#e3f0f9;
  --sol:#e8a600; --sol-soft:#fdf3d6;
  --ok:#1f8a4c; --ok-soft:#e1f3e8; --warn:#c77700; --warn-soft:#fdf0dc; --crit:#c8372d; --crit-soft:#fbe5e3;
  --muted:#8796a0; --shadow:0 6px 24px rgba(20,34,43,.16);
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1418; --surface:#16212a; --surface-2:#1d2a34; --ink:#e8eef1; --ink-2:#a7b6bf; --line:#2a3945;
  --celeste:#59ade6; --celeste-ink:#06131c; --celeste-soft:#16324a; --sol:#f2bc2e; --sol-soft:#3a2f12;
  --ok:#4cc27e; --ok-soft:#15301f; --warn:#f0a23a; --warn-soft:#382812; --crit:#f06a5f; --crit-soft:#3a1916;
  --muted:#7f909b; --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0d1418; --surface:#16212a; --surface-2:#1d2a34; --ink:#e8eef1; --ink-2:#a7b6bf; --line:#2a3945;
  --celeste:#59ade6; --celeste-ink:#06131c; --celeste-soft:#16324a; --sol:#f2bc2e; --sol-soft:#3a2f12;
  --ok:#4cc27e; --ok-soft:#15301f; --warn:#f0a23a; --warn-soft:#382812; --crit:#f06a5f; --crit-soft:#3a1916;
  --muted:#7f909b; --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark;}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at top left, rgba(42,134,196,.12), transparent 30%), linear-gradient(180deg,var(--bg), #edf5f7 100%);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--celeste);outline-offset:2px}
[hidden]{display:none!important}
#map{position:fixed;inset:0;background:var(--surface-2)}
.leaflet-container{font-family:var(--f-body)}
.leaflet-control-attribution{font-size:10px;background:color-mix(in srgb,var(--surface) 80%,transparent)!important;color:var(--ink-2)}
.leaflet-control-attribution a{color:var(--celeste)}

/* barra superior */
.top{position:fixed;z-index:500;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 10px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.top>*{pointer-events:auto}
.brand{background:linear-gradient(180deg, rgba(255,255,255,.98), rgba(244,246,247,.96));border:1px solid rgba(20,34,43,.05);border-radius:18px;box-shadow:0 14px 30px rgba(20,34,43,.12);padding:10px 12px 11px;display:flex;flex-direction:column;min-width:0;flex:1 1 auto;max-width:430px;backdrop-filter:blur(10px)}
.brand-top{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:18px;height:18px;border-radius:8px;background:linear-gradient(135deg,var(--celeste),#5ec5ff 55%,#e8f6ff);box-shadow:inset 0 0 0 2px rgba(255,255,255,.8),0 10px 22px rgba(42,134,196,.35);flex:none;position:relative}
.brand-mark::after{content:"";position:absolute;inset:5px;border-radius:5px;border:1.5px solid rgba(255,255,255,.85)}
.brand-copy{min-width:0;display:flex;flex-direction:column;gap:2px}
.eyebrow{font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);font-weight:700}
.brand b{font:700 19px/1.05 var(--f-display);letter-spacing:.2px;display:flex;align-items:center;gap:7px}
.brand b i{display:none}
.brand-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.cityTag{display:inline-flex;align-items:center;gap:6px;padding:4px 8px;background:var(--celeste-soft);color:var(--celeste);border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.2px}
.liveDot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(31,138,76,.15);animation:pulse 2s infinite}
.liveText{font-size:11px;color:var(--ink-2);font-weight:600}
.zone{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.zone strong{color:var(--ink);font-weight:700}
.modes{display:flex;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:4px;gap:2px;flex:none}
.modes button{border:0;background:transparent;padding:7px 9px;border-radius:10px;font-size:12.5px;font-weight:600;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:2px;min-width:46px;transition:transform .18s ease, box-shadow .18s ease}
.modes button:hover{transform:translateY(-1px)}
.modes button svg{width:20px;height:20px}
.modes button[aria-pressed="true"]{background:linear-gradient(180deg,var(--celeste),#3ba7df);color:var(--celeste-ink);box-shadow:0 10px 22px rgba(42,134,196,.18)}

/* botones flotantes */
.fabs{position:fixed;z-index:500;right:max(12px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 86px);display:flex;flex-direction:column;gap:8px}
.fab{width:46px;height:46px;border-radius:14px;border:0;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);display:grid;place-items:center}
.fab svg{width:22px;height:22px}
.fab[aria-pressed="true"]{background:var(--celeste);color:var(--celeste-ink)}
.report{position:fixed;z-index:520;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(var(--sheet-h,190px) + 14px + env(safe-area-inset-bottom,0px));border:0;border-radius:999px;background:var(--crit);color:#fff;font:700 15px var(--f-display);letter-spacing:.3px;padding:13px 18px 13px 14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;transition:bottom .25s}
.report svg{width:22px;height:22px}

/* capas */
.layers{position:fixed;z-index:560;right:max(68px,calc(env(safe-area-inset-right,0px) + 68px));top:calc(env(safe-area-inset-top,0px) + 86px);background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:10px 12px;display:grid;gap:4px;min-width:220px}
.layers h4{margin:0 0 4px;font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.layers label{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:14px}
.layers .sw{width:12px;height:12px;border-radius:3px;flex:none}
.layers small{color:var(--muted);margin-left:auto;font-size:11px}

/* hoja inferior */
.sheet{position:fixed;z-index:540;left:0;right:0;bottom:0;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:0 -6px 30px rgba(20,34,43,.18);display:flex;flex-direction:column;height:var(--sheet-h,190px);max-height:calc(100% - 90px - env(safe-area-inset-top,0px));transition:height .25s ease;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.dragging{transition:none}
.grab{padding:8px 0 2px;display:grid;place-items:center;cursor:grab;touch-action:none}
.grab i{width:42px;height:5px;border-radius:9px;background:var(--line)}
.tabs{display:flex;gap:6px;padding:4px max(16px,env(safe-area-inset-left,0px)) 8px max(16px,env(safe-area-inset-right,0px));overflow-x:auto;scrollbar-width:none;flex:none}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tabs .n{background:var(--crit);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;line-height:17px}
.body{overflow-y:auto;padding:2px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));flex:1;min-height:0;overscroll-behavior:contain}
@media (min-width:860px){
  .demo{left:440px;bottom:24px!important}
  .sheet{left:max(16px,env(safe-area-inset-left,0px));right:auto;width:410px;bottom:16px;border-radius:20px;height:calc(100% - 118px)!important;max-height:none;top:auto}
  .grab{display:none}
  .report{bottom:calc(24px + env(safe-area-inset-bottom,0px))!important}
  .brand{max-width:410px}
}

/* contenido */
.sec{font:600 11.5px var(--f-body);text-transform:uppercase;letter-spacing:.9px;color:var(--muted);margin:14px 0 6px;display:flex;justify-content:space-between;align-items:baseline}
.sec:first-child{margin-top:4px}
.row{display:flex;gap:11px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.row:last-child{border-bottom:0}
.row .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;font:700 12px var(--f-display)}
.row .ic svg{width:20px;height:20px}
.row .tx{min-width:0;flex:1}
.row .t{font-weight:600;font-size:14.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row .s{font-size:12.5px;color:var(--ink-2)}
.row .r{text-align:right;flex:none;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.row .r b{display:block;font:700 18px/1 var(--f-display);color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;line-height:1.6;white-space:nowrap}
.pill.plan{background:var(--surface-2);color:var(--ink-2)} .pill.exec{background:var(--warn-soft);color:var(--warn)} .pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.crit{background:var(--crit-soft);color:var(--crit)} .pill.info{background:var(--celeste-soft);color:var(--celeste)} .pill.sol{background:var(--sol-soft);color:var(--warn)}
.src{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:6px}
.src i{width:7px;height:7px;border-radius:9px;display:inline-block}
.src.real i{background:var(--ok)} .src.sim i{background:var(--sol)}
.card{background:var(--surface-2);border-radius:12px;padding:12px}
.lines{display:flex;flex-wrap:wrap;gap:5px}
.ln{font:700 13px var(--f-display);border-radius:6px;padding:1px 7px;background:var(--ink);color:var(--surface);white-space:nowrap}
.ln.r{background:#c8372d;color:#fff} .ln.v{background:#1f8a4c;color:#fff}
.arr{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-variant-numeric:tabular-nums}
.arr .m{font:700 17px var(--f-display)}
.arr .m small{font:500 12px var(--f-body);color:var(--ink-2)}
.empty{color:var(--ink-2);font-size:14px;padding:10px 0}

/* detalle */
.dhead{display:flex;gap:10px;align-items:flex-start;margin:2px 0 8px}
.back{border:0;background:var(--surface-2);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;flex:none}
.back svg{width:20px;height:20px}
h2{font:700 22px/1.12 var(--f-display);margin:0;text-wrap:balance}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px;margin:10px 0}
.meta dt{color:var(--ink-2)} .meta dd{margin:0;font-weight:500;min-width:0}
.bar{height:8px;border-radius:9px;background:var(--surface-2);overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--celeste);border-radius:9px}
.tl{list-style:none;margin:8px 0 0;padding:0 0 0 14px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 10px 8px;font-size:13.5px}
.tl li::before{content:"";position:absolute;left:-21px;top:5px;width:10px;height:10px;border-radius:9px;background:var(--celeste);border:2px solid var(--surface)}
.tl time{display:block;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:7px;flex:1 1 auto}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--celeste);color:var(--celeste-ink)}
.btn.red{background:var(--crit);color:#fff}
.btn.sec2{background:var(--surface-2);color:var(--ink)}
.spark{display:flex;gap:6px;align-items:flex-end;height:64px;margin-top:6px}
.spark div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.spark span{display:block;width:100%;border-radius:5px 5px 2px 2px;background:var(--celeste)}
.spark b{font:700 13px var(--f-display);color:var(--ink)}
.big{display:flex;gap:10px;margin:8px 0}
.big>div{flex:1;background:var(--surface-2);border-radius:12px;padding:10px 12px}
.big b{display:block;font:700 30px/1 var(--f-display);font-variant-numeric:tabular-nums}
.big small{font-size:12px;color:var(--ink-2)}

/* formularios */
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:8px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 10px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;font-weight:600;font-size:13.5px}
.opt svg{width:22px;height:22px;color:var(--crit)}
.opt[aria-pressed="true"]{border-color:var(--crit);background:var(--crit-soft)}
.photo{border:1.5px dashed var(--line);border-radius:12px;display:flex;align-items:center;gap:12px;padding:10px;margin-top:8px;position:relative;cursor:pointer}
.photo input{position:absolute;inset:0;opacity:0;cursor:pointer}
.photo .th{width:64px;height:64px;border-radius:9px;background:var(--surface-2) center/cover;display:grid;place-items:center;flex:none;color:var(--muted)}
.photo .th svg{width:26px;height:26px}
label.f{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
textarea,select{width:100%;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:9px 10px}
textarea{min-height:68px;resize:vertical}
.dup{border:2px solid var(--sol);background:var(--sol-soft);border-radius:14px;padding:12px;margin-top:10px}
.dup h3{margin:0 0 4px;font:700 18px var(--f-display)}
.ok{border-radius:14px;background:var(--ok-soft);padding:14px;margin-top:8px}
.ok h3{margin:0 0 4px;font:700 19px var(--f-display);color:var(--ok)}
.ticket{font:700 15px var(--f-display);letter-spacing:.5px}

/* aviso proactivo */
.nudge{position:fixed;z-index:600;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 82px);max-width:430px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;border-left:5px solid var(--celeste);animation:drop .3s ease}
.nudge.alert{border-left-color:var(--crit)} .nudge.ask{border-left-color:var(--sol)}
.nudge .k{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.9px;color:var(--muted)}
.nudge p{margin:3px 0 0;font-size:14.5px}
.nudge .btns{margin-top:10px}
.nudge .btn{padding:9px 12px;font-size:13.5px}
@keyframes drop{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:860px){.nudge{left:auto;right:76px;width:380px}}
.toast{position:fixed;z-index:650;left:50%;transform:translateX(-50%);bottom:calc(var(--sheet-h,190px) + 130px);background:var(--ink);color:var(--surface);border-radius:12px;padding:10px 14px;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* demo */
.demo{position:fixed;z-index:510;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(var(--sheet-h,190px) + 78px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);border-radius:999px;padding:6px 8px 6px 14px;display:flex;gap:10px;align-items:center;font-size:13px;box-shadow:var(--shadow);white-space:nowrap}
.demo button{border:0;background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 11px;font-weight:700;font-size:12.5px}
.demo .pg{width:80px;height:5px;border-radius:9px;background:color-mix(in srgb,var(--surface) 25%,transparent);overflow:hidden}
.demo .pg i{display:block;height:100%;background:var(--sol)}

/* marcadores */
.mk{display:grid;place-items:center;border-radius:9px;color:#fff;font:700 11px/1 var(--f-display);box-shadow:0 1px 4px rgba(0,0,0,.35);border:2px solid #fff}
.mk svg{width:15px;height:15px}
.mk.obra.planificada{background:#6f8796}.mk.obra.en_ejecucion{background:#c77700}.mk.obra.finalizada{background:#1f8a4c}
.mk.pp{background:#e8a600;color:#14222b;border-radius:50%}
.mk.pp.finalizado{box-shadow:0 0 0 3px rgba(31,138,76,.85),0 1px 4px rgba(0,0,0,.35)}
.mk.parada{background:#2a86c4;border-radius:7px}
.mk.bici{background:#0f8a83;border-radius:50%;font-size:12px}
.mk.bici.low{background:#c8372d}
.mk.rec{background:#c8372d;border-radius:50% 50% 50% 4px;transform:rotate(-45deg)}
.mk.rec span{transform:rotate(45deg)}
.mk.mine{background:#7a3fc1}
.me{width:20px;height:20px;border-radius:50%;background:#2a86c4;border:3px solid #fff;box-shadow:0 0 0 0 rgba(42,134,196,.5);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(42,134,196,.5)}70%{box-shadow:0 0 0 16px rgba(42,134,196,0)}100%{box-shadow:0 0 0 0 rgba(42,134,196,0)}}
.leaflet-popup-content-wrapper{border-radius:12px}
.map-dark .leaflet-tile{filter:brightness(.78) invert(.9) hue-rotate(180deg) saturate(.65)}

/* pulido visual e interacciones */
:root{
  --celeste:#1679a8; --celeste-ink:#fff; --celeste-soft:#e4f3f8;
  --ink:#172b35; --ink-2:#536873; --line:#dce7e9; --surface:#fff;
  --surface-2:#f2f7f7; --bg:#edf3f1; --r:18px;
  --shadow:0 12px 36px rgba(23,43,53,.13),0 2px 8px rgba(23,43,53,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --celeste:#70c8ed; --celeste-ink:#09202a; --celeste-soft:#183b49;
  --ink:#e7f0f2; --ink-2:#a9bdc3; --line:#2b4149; --surface:#14242a;
  --surface-2:#1a3037; --bg:#0e1b20; --shadow:0 16px 42px rgba(0,0,0,.32);}}
:root[data-theme="dark"]{
  --celeste:#70c8ed; --celeste-ink:#09202a; --celeste-soft:#183b49;
  --ink:#e7f0f2; --ink-2:#a9bdc3; --line:#2b4149; --surface:#14242a;
  --surface-2:#1a3037; --bg:#0e1b20; --shadow:0 16px 42px rgba(0,0,0,.32);}
body{background:var(--bg)}
button{transition:transform .18s ease,background-color .18s ease,color .18s ease,box-shadow .18s ease,border-color .18s ease}
button:active{transform:scale(.97)}
.top{padding-top:calc(env(safe-area-inset-top,0px) + 16px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:12px}
.brand{padding:14px 16px 13px;border:1px solid rgba(255,255,255,.72);border-radius:22px;background:color-mix(in srgb,var(--surface) 88%,transparent);box-shadow:0 16px 44px rgba(21,51,60,.14);backdrop-filter:blur(18px) saturate(1.35);animation:floatIn .55s cubic-bezier(.2,.8,.2,1) both}
.brand-mark{width:24px;height:24px;border-radius:9px}
.brand-mark::after{inset:7px}
.brand b{font-size:21px;letter-spacing:.1px}

<script>
(()=>{
"use strict";
const D = window.MDR;
const WS = 'https://ws.rosario.gob.ar/ubicaciones/public';   // servicios públicos de la Municipalidad (CORS abierto)
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtFecha = iso => { if (!iso) return '—'; const [y,m,d] = iso.split('-'); return `${+d}/${+m}/${y}`; };
const fmtM = m => m < 1000 ? `${Math.max(10, Math.round(m/10)*10)} m` : `${(m/1000).toFixed(1).replace('.',',')} km`;
const money = n => '$ ' + Math.round(n/1e6).toLocaleString('es-AR') + ' M';
const hash = s => { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const dist = (a, b) => Math.hypot((a[0]-b[0])*111320, (a[1]-b[1])*93500);
const title = s => String(s||'').toLowerCase().replace(/(^|[\s.(])([a-záéíóúñü])/g, (m, a, b) => a + b.toUpperCase()).replace(/\b(Y|E|De|Del|La|Las|Los)\b/g, w => w.toLowerCase());
const ICON = {
  bus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14M8 21v-4M16 21v-4"/></svg>',
  bici:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="17" r="3.5"/><circle cx="18.5" cy="17" r="3.5"/><path d="M15 6h2l1.5 11M5.5 17l4-8h6l-6.5 8"/></svg>',
  obra:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M6 20V10l6-5 6 5v10M10 20v-5h4v5"/></svg>',
  cone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16M9 4h6l4 16H5z M7.5 11h9"/></svg>',
  caño:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h11a4 4 0 0 1 4 4v8M3 15h8a1 1 0 0 1 1 1v5"/></svg>',
  asfalto:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 21l3-18M17 21l-3-18M12 6v2M12 11v2M12 16v2"/></svg>',
  luz:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V9M12 9c0-3 2-5 6-5M18 4v3M8 22h8"/></svg>',
  basura:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  bache:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><ellipse cx="12" cy="14" rx="8" ry="4"/><path d="M8 13l2 1 2-2 2 2 2-1"/></svg>',
  arbol:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-7M7 15a5 5 0 1 1 3-9 5 5 0 0 1 7 4 4 4 0 0 1-1 5z"/></svg>',
  semaforo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="8" y="2" width="8" height="18" rx="3"/><circle cx="12" cy="7" r="1.5"/><circle cx="12" cy="11" r="1.5"/><circle cx="12" cy="15" r="1.5"/></svg>',
  vereda:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 18h18M5 14h6l2 4M14 14h5"/></svg>',
  otro:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16v.5"/></svg>',
  corte:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="9" width="18" height="6" rx="1"/><path d="M7 9l-2 6M12 9l-2 6M17 9l-2 6M6 15v5M18 15v5"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  pp:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7M6 10v10h12V10M10 20v-5h4v5"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11v9H4v-9zM7 11l4-8c1.5 0 2.5 1 2.5 2.5V9h5a2 2 0 0 1 2 2.3l-1.2 7A2 2 0 0 1 17.3 20H7"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 13V4H4v9zM7 13l4 8c1.5 0 2.5-1 2.5-2.5V15h5a2 2 0 0 0 2-2.3l-1.2-7A2 2 0 0 0 17.3 4H7"/></svg>',
};
const VIA = {usuario:'Ingresó con usuario y contraseña', google:'Ingresó con Google (simulado)', facebook:'Ingresó con Facebook (simulado)'};
const REC_TIPOS = {luminaria:['Luminaria','luz'], contenedor:['Contenedor','basura'], bache:['Bache','bache'], arbol:['Árbol o rama','arbol'], semaforo:['Semáforo','semaforo'], vereda:['Vereda rota','vereda'], otro:['Otro','otro']};
const AREA = {luminaria:'Alumbrado Público', contenedor:'Higiene Urbana', bache:'Obras Públicas', arbol:'Parques y Paseos', semaforo:'Tránsito', vereda:'Obras Públicas', otro:'Atención Ciudadana (147)'};
const EST_OBRA = {planificada:['Planificada','plan'], en_ejecucion:['En ejecución','exec'], finalizada:['Finalizada','done']};
const EST_PP = {ganador:['Ganador, a ejecutar','plan'], proyectado:['Proyectado','plan'], en_obra:['En ejecución','exec'], finalizado:['Finalizado','done']};
const EST_REC = {recibido:['Recibido','plan'], asignado:['Asignado a cuadrilla','info'], en_curso:['En curso','exec']};
const MODO = {peaton:'a pie', bici:'en bici', auto:'en auto'};
const RADIO_MODO = {peaton:350, bici:700, auto:1200};
const ZOOM_MODO = {peaton:17, bici:16, auto:15};
const ALERTA_MODO = {peaton:180, bici:350, auto:700};

/* ---------- datos ---------- */
const stops = D.tup.stops.map(s => ({id:'P'+s[0], num:s[0], lat:s[1], lon:s[2], lineas:s[3]}));
const lines = Object.fromEntries(D.tup.lines.map(l => [l.id, l]));
const bicis = D.bici.stations.map(s => ({id:'B'+s[0], codigo:s[0], nombre:s[1], dir:s[2], lat:s[3], lon:s[4], bicis:s[5], libres:s[6], estado:s[7], cap:s[8] || (s[5]+s[6])}));
const cols = D.luminarias.columnas;
const oreal = D.obras_infomapa.obras;
const pp = D.pp.proyectos;
const {obras, cortes, reclamos} = D.sim;
oreal.forEach(o => o.sim = false); obras.forEach(o => o.sim = true);

/* índice espacial simple para capas grandes */
function grid(items, get, cell = 0.004){ const g = new Map(); items.forEach((it, i) => { const [la, lo] = get(it, i); const k = Math.floor(la/cell) + ':' + Math.floor(lo/cell); (g.get(k) || g.set(k, []).get(k)).push(i); }); return {g, cell}; }
function query(ix, p, r){ const dl = r/111320, dn = r/93500, out = [];
  for (let a = Math.floor((p[0]-dl)/ix.cell); a <= Math.floor((p[0]+dl)/ix.cell); a++) for (let b = Math.floor((p[1]-dn)/ix.cell); b <= Math.floor((p[1]+dn)/ix.cell); b++) { const c = ix.g.get(a+':'+b); if (c) out.push(...c); }
  return out; }
const ixStops = grid(stops, s => [s.lat, s.lon]);
const ixCols = grid(cols, c => c);
const semaf = D.semaforos.cruces;              // reales (Infomapa)
const conts = D.sim.contenedores;              // simulados: [lat, lon, tipo, estado]
const ixSem = grid(semaf, c => c), ixCont = grid(conts, c => c);
const EST_CONT = {ok:['En condiciones','done'], lleno:['Desbordado','exec'], roto:['Roto','crit']};
const ELEM = {
  contenedor:{arr:conts, ix:ixCont, pre:'C', nom:'Contenedor', area:'Higiene Urbana'},
  semaforo:{arr:semaf, ix:ixSem, pre:'S', nom:'Semáforo', area:'Tránsito'},
};

/* ---------- estado ---------- */
const S = {
  pos: D.sim.ruta_demo[0].slice(), focus: D.sim.ruta_demo[0].slice(), follow: true, heading: null, gps: null,
  mode: 'peaton', radio: null, tab: 'cerca', view: null, mine: [], prompted: new Set(), lastNudge: 0,
  shown: new Set(), firstDraw: true, addr: null,
  layers: {oreal:true, obras:true, pp:true, paradas:true, bicis:true, cortes:true, reclamos:true, luminarias:true, semaforos:true, contenedores:true},
};
const R = () => S.radio || RADIO_MODO[S.mode];

/* ---------- cuenta (prototipo: las cuentas viven en este navegador) ---------- */
const store = {get(k, d){ try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch(e) { return d; } }, set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e) { return false; } }};
const ME = {user:null};
const iniciales = n => String(n||'?').trim().split(/\s+/).slice(0,2).map(w => w[0]).join('').toUpperCase();
async function hashPass(pass, salt){
  try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pass)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join(''); }
  catch(e) { return 'f' + hash(salt + ':' + pass).toString(16); }
}
async function seedDemo(){ const U = store.get('mdr-users', {}); if (!U['u:vecino']){ const salt = 'demo'; U['u:vecino'] = {id:'u:vecino', usuario:'vecino', nombre:'Vecina de prueba', via:'usuario', salt, hash: await hashPass('rosario2026', salt)}; store.set('mdr-users', U); } }
const mineKey = () => 'mdr-mine-' + (ME.user ? ME.user.id : 'invitado');
function loadMine(){
  S.mine = store.get(mineKey(), []); if (!Array.isArray(S.mine)) S.mine = [];
  for (const m of S.mine) if (m.kind === 'reclamo' && m.data && !reclamos.find(r => r.id === m.data.id)) reclamos.push(m.data);
}
const saveMine = () => store.set(mineKey(), S.mine.slice(-40));
// opiniones de vecinos sobre proyectos del PP (las simuladas se generan; las tuyas se guardan acá)
const OPS = store.get('mdr-op', {});
const saveOps = () => { if (!store.set('mdr-op', OPS)) { for (const k in OPS) (OPS[k].lista||[]).forEach(x => delete x.foto); store.set('mdr-op', OPS); } };

/* ---------- servicios en vivo de la Municipalidad ---------- */
let wsOk = null;
function setLive(ok, txt){ wsOk = ok; $('#liveText').textContent = txt || (ok ? 'Datos municipales en vivo' : 'Sin conexión a servicios municipales'); $('#liveDot').style.background = ok ? '' : 'var(--warn)'; }
async function getJSON(url, ms = 6000){ const c = new AbortController(); const t = setTimeout(() => c.abort(), ms);
  try { const r = await fetch(url, {signal:c.signal}); if (!r.ok) throw new Error(r.status); const j = await r.json(); setLive(true); return j; }
  catch(e){ setLive(false); throw e; } finally { clearTimeout(t); } }
// dirección + barrio del punto (geocodificación inversa oficial)
let geoT = 0, geoLast = null, geoBusy = false;
async function reverseGeo(p, force){
  if (geoBusy || (!force && geoLast && dist(p, geoLast) < 35) || (!force && Date.now() - geoT < 2500)) return;
  geoBusy = true; geoT = Date.now(); geoLast = p.slice();
  try {
    const f = await getJSON(`${WS}/geojson/direccion/punto?latitud=${p[0].toFixed(6)}&longitud=${p[1].toFixed(6)}`);
    const [x, y] = f.geometry.coordinates; const pr = f.properties || {};
    let barrio = null, distrito = null;
    try { const d = await getJSON(`${WS}/direccion/punto?x=${x}&y=${y}`); const g = k => (d.divsAdmins||[]).find(v => v.nombreTipo === k)?.valor;
      barrio = g('Barrio'); distrito = g('Distrito'); } catch(e) {}
    S.addr = {calle: title(pr.name || ''), barrio: barrio ? title(barrio) : null, distrito: distrito ? title(distrito) : zonaDe(p)};
  } catch(e) { S.addr = {calle:null, barrio:null, distrito:zonaDe(p)}; }
  geoBusy = false; header();
}
// arribos reales de Cuándo Llega (cache 25 s)
const arrCache = new Map();
async function arribosReales(num){
  const c = arrCache.get(num); if (c && Date.now() - c.t < 25000) return c.v;
  const j = await getJSON(`${WS}/cuandollega?parada=${num}`);
  const v = j.map(x => ({linea: x.linea.nombreCorto || x.linea.nombre, color: x.linea.color, arribos: (x.arribos||[]).map(a => ({min:a.arriboEnMinutos, hora:a.horaArribo, lat:a.latitud, lon:a.longitud, coche:a.vehiculo, tipo:a.tipo}))}));
  arrCache.set(num, {t:Date.now(), v}); return v;
}
function arribosSim(stop, linea){
  const t = new Date(); const m = t.getHours()*60 + t.getMinutes(); const fr = (7 + hash(linea) % 12) * ((m < 360 || m > 1350) ? 2.2 : 1);
  const n1 = fr - ((m + hash(stop.num + '|' + linea) % Math.round(fr)) % fr); return [Math.max(1, Math.round(n1)), Math.round(n1 + fr)];
}
function biciEn(st, mins = 0){
  const t = new Date(); const m = t.getHours()*60 + t.getMinutes() + mins;
  const v = Math.sin(m/47 + (hash(st.codigo) % 628)/100) * Math.min(4, st.cap/5) + Math.sin(m/13 + st.codigo) * 1.1;
  const b = Math.max(0, Math.min(st.cap, Math.round(st.bicis + v))); return {bicis:b, libres:st.cap - b};
}

/* ---------- utilidades de lugar ---------- */
const lnClass = id => /Roj/i.test(id) ? 'r' : /Verd/i.test(id) ? 'v' : '';
const lnLabel = id => String(id).replace(/ (Negra|Roja|Verde)$/, m => ' ' + m.trim()[0]);
const lnChip = id => `<span class="ln ${lnClass(id)}" title="Línea ${esc(id)}">${esc(lnLabel(id))}</span>`;
function zonaDe(p){ const C = {Centro:[-32.945,-60.645], Norte:[-32.900,-60.690], Noroeste:[-32.925,-60.735], Oeste:[-32.960,-60.715], Sudoeste:[-32.990,-60.690], Sur:[-33.000,-60.645]};
  return Object.keys(C).reduce((a,k) => dist(p, C[k]) < dist(p, C[a]) ? k : a, 'Centro'); }
function distSeg(p, a, b){
  const ax=a[1]*93500, ay=a[0]*111320, bx=b[1]*93500, by=b[0]*111320, px=p[1]*93500, py=p[0]*111320;

/* qué hay alrededor de un punto */
function alrededor(p, r){
  const near = (arr, f = o => dist(p, [o.lat, o.lon])) => arr.map(o => ({o, d:f(o)})).filter(x => x.d <= r).sort((a,b) => a.d - b.d);
  return {
    oreal: S.layers.oreal ? near(oreal, o => dOreal(p, o)) : [],
    obras: S.layers.obras ? near(obras) : [],
    pp: S.layers.pp ? near(pp) : [],
    cortes: S.layers.cortes ? near(cortes, c => dCorte(p, c)) : [],
    reclamos: S.layers.reclamos ? near(reclamos) : [],
    bicis: S.layers.bicis ? near(bicis) : [],
    paradas: S.layers.paradas ? query(ixStops, p, r).map(i => stops[i]).map(o => ({o, d:dist(p, [o.lat,o.lon])})).filter(x => x.d <= r).sort((a,b) => a.d-b.d) : [],
  };

function setHeading(h){ S.heading = h; const w = document.getElementById('meWrap'), c = document.getElementById('meCone'); if (!w || !c) return; w.classList.toggle('idle', h == null); if (h != null) c.style.transform = `rotate(${h}deg)`; }
// centro del mapa para que tu posición quede en la parte visible (arriba del panel en el celu, a la derecha del panel en la compu)
function visCenter(p, z){ z = z ?? map.getZoom(); const pt = map.project(L.latLng(p), z);
  const sh = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sheet-h')) || 210;
  const off = innerWidth >= 860 ? L.point(document.body.classList.contains('panel-off') ? 0 : -220, 0) : L.point(0, Math.min(sh, innerHeight * .6) / 2 - 40);
  return map.unproject(pt.add(off), z); }

  if (opts.heading != null) setHeading(opts.heading); else if (dist(prev, p) > 2) setHeading(bearing(prev, p));

  if (S.follow && (!lastDraw || dist(lastDraw, p) > 8 || opts.force)){ lastDraw = p.slice(); drawAround(); if (!S.view) render(); else renderTabs(); }
  reverseGeo(S.follow ? p : S.focus);

}

  if (on){ S.focus = S.pos; { const z = Math.max(map.getZoom(), ZOOM_MODO[S.mode] - 1); map.setView(visCenter(S.pos, z), z); } lastDraw = null; setPos(S.pos, {force:true}); reverseGeo(S.pos, true); }
}

/* caminar: tocar el mapa te lleva caminando hasta ahí; flechas/WASD dan un paso */
let walkT = null;

  if (!S.follow) setFollow(true);
  const step = S.mode === 'auto' ? 40 : S.mode === 'bici' ? 20 : 9;
  walkT = setInterval(() => { const d = dist(S.pos, dst); if (d < step){ clearInterval(walkT); setPos(dst); return; }
    const f = step / d; setPos([S.pos[0] + (dst[0]-S.pos[0])*f, S.pos[1] + (dst[1]-S.pos[1])*f]); }, 140);
}
map.on('click', e => { if (S.gps != null) return toast('Estás siguiendo tu GPS real. Apagalo para simular movimiento.'); walkTo([e.latlng.lat, e.latlng.lng]); toast(`Caminando hacia ahí (${fmtM(dist(S.pos, [e.latlng.lat, e.latlng.lng]))})`); });

  setPos([S.pos[0] + k[0]*st/111320, S.pos[1] + k[1]*st/93500]);
});

/* GPS real: arranca solo al abrir la app; el botón lo apaga o lo vuelve a prender */
S.real = false;
function stopGPS(){ if (S.gps != null) navigator.geolocation.clearWatch(S.gps); S.gps = null; $('#btnLoc').setAttribute('aria-pressed','false'); }
function startGPS(auto, lowAcc){
  if (!navigator.geolocation) return auto || toast('Este navegador no permite ubicación. Tocá el mapa para moverte.');
  if (!window.isSecureContext) return auto || toast('La ubicación solo funciona abriendo la app desde el link https.');
  stopGPS(); let first = true;
  S.gps = navigator.geolocation.watchPosition(pos => {
    const q = [pos.coords.latitude, pos.coords.longitude];
    if (dist(q, [-32.95,-60.66]) > 25000){ stopGPS(); S.real = false; header(); return toast('Estás fuera de Rosario: la app queda en una ubicación de ejemplo. Tocá el mapa para moverte.'); }
    if (first){ first = false; demoStop(); clearInterval(walkT); S.real = true; setFollow(true); setPos(q, {force:true});
      const z = Math.max(map.getZoom(), ZOOM_MODO[S.mode]); map.setView(visCenter(q, z), z, {animate:false});
      toast(`Usando tu ubicación real${pos.coords.accuracy > 150 ? ` (precisión de ${Math.round(pos.coords.accuracy)} m)` : ''}`); return; }
    setPos(q, {heading: pos.coords.heading != null && !isNaN(pos.coords.heading) && pos.coords.speed > .5 ? pos.coords.heading : undefined});
  }, err => {
    stopGPS();
    if (err.code === 3 && !lowAcc) return startGPS(auto, true);          // tardó mucho: reintenta con menos precisión
    S.real = false; header();
    toast(err.code === 1 ? 'No diste permiso de ubicación. Activalo en la configuración del navegador para este sitio y tocá el botón de ubicación.'
                         : 'No pudimos obtener tu ubicación. Revisá que el GPS esté prendido o tocá el mapa para moverte.');
  }, {enableHighAccuracy:!lowAcc, maximumAge:5000, timeout: lowAcc ? 20000 : 12000});
  $('#btnLoc').setAttribute('aria-pressed','true'); header();
}
$('#btnLoc').onclick = () => {
  if (S.gps != null){ stopGPS(); return toast('Seguimiento por GPS apagado. Tocá el mapa para moverte.'); }
  if (S.real && !S.follow) setFollow(true);
  startGPS(false);
};

    S.prompted.add(c.id);

    return nudge('alert', `Corte a ${fmtM(d)} · vas ${MODO[S.mode]}`, `${c.tipo === 'total' ? 'Corte total' : 'Reducción de calzada'} por ${esc(c.motivo.toLowerCase())}, ${esc(c.horario.toLowerCase())}.${lineasTxt}`,
      [['Ver corte','pri', () => open({k:'corte', o:c})], ['Entendido','sec2', null]]); }
  const fin = [...obras.filter(o => o.estado === 'finalizada').map(o => ({k:'obra', o})), ...pp.filter(o => o.estado === 'finalizado').map(o => ({k:'pp', o}))];
  for (const it of fin){ const d = dist(p, [it.o.lat, it.o.lon]); if (d > 90 || S.prompted.has(it.o.id)) continue;

      [['Ajustar / corregir','red', () => open({k:'ajustar', o:it.o, tipo:it.k})], ['Quedó bien','sec2', () => conCuenta('Para validar la obra necesitamos saber quién sos.', () => { addMine({kind:'valida', ref:it.o.id, titulo:it.o.titulo}); toast('Gracias. Sumaste una validación vecinal.'); })]]); }

}

  lay.ruta.clearLayers(); L.polyline(D.sim.ruta_demo, {color:'#2a86c4', weight:5, opacity:.35, dashArray:'2 9', lineCap:'round', interactive:false}).addTo(lay.ruta);
  if (S.mode !== 'peaton') setMode('peaton');
  S.pos = demo.pts[0].slice(); S.firstDraw = true; S.shown.clear(); setFollow(true); map.setView(visCenter(demo.pts[0], 17), 17);
  demo.timer = setInterval(() => {
    if (!$('#nudge').hidden) return;                // pausa mientras hay un aviso
    demo.i++; if (demo.i >= demo.pts.length) return demoStop(true);
    $('#demoPg').style.width = (100 * demo.i / demo.pts.length) + '%';
    setPos(demo.pts[demo.i]);
  }, 230);
}
function demoStop(fin){
  if (!demo.on) return;
  demo.on = false; clearInterval(demo.timer); $('#demo').hidden = true; $('#btnDemo').setAttribute('aria-pressed','false'); lay.ruta.clearLayers();

}
$('#btnDemo').onclick = () => demo.on ? demoStop() : demoStart();

/* ---------- búsqueda de direcciones (geocodificador oficial) ---------- */
let qT;
$('#btnSearch').onclick = () => { const s = $('#search'); s.hidden = !s.hidden; $('#btnSearch').setAttribute('aria-expanded', String(!s.hidden)); if (!s.hidden) setTimeout(() => $('#q').focus(), 50); };
$('#q').addEventListener('input', () => { clearTimeout(qT); const t = $('#q').value.trim(); if (t.length < 4) { $('#qres').innerHTML = ''; return; } qT = setTimeout(() => buscar(t), 350); });
async function buscar(t){
  $('#qres').innerHTML = '<small style="padding:8px 6px;color:var(--ink-2)">Buscando…</small>';
  try {
    const j = await getJSON(`${WS}/geojson/ubicaciones/all/all/${encodeURIComponent(t)}`);
    const fs = (j.features||[]).filter(f => f.geometry).slice(0, 5);
    if (!fs.length) { $('#qres').innerHTML = '<small style="padding:8px 6px;color:var(--ink-2)">No encontramos esa dirección.</small>'; return; }
    const res = await Promise.all(fs.map(async f => { const [x, y] = f.geometry.coordinates; try { const ll = await getJSON(`${WS}/coordenadaLatLon/${x}/${y}/`); return {n:title(f.properties.name), p:[ll.latitud, ll.longitud]}; } catch(e) { return null; } }));
    $('#qres').innerHTML = res.filter(Boolean).map((r, i) => `<button data-i="${i}">${esc(r.n)}<small>Ver qué hay alrededor</small></button>`).join('');
    $('#qres').querySelectorAll('button').forEach(b => b.onclick = () => { const r = res.filter(Boolean)[+b.dataset.i];
      $('#search').hidden = true; demoStop(); clearInterval(walkT); setFollow(false); map.setView(r.p, ZOOM_MODO[S.mode]); toast(`Explorando ${r.n}. Tocá el mapa para caminar hasta ahí.`); });
  } catch(e) { $('#qres').innerHTML = '<small style="padding:8px 6px;color:var(--ink-2)">El buscador municipal no responde ahora.</small>'; }
}

const sheet = $('#sheet');
const SH = [210, Math.round(innerHeight * .55), innerHeight - 100];
let shIdx = 0;
const setSheet = i => { shIdx = Math.max(0, Math.min(2, i)); document.documentElement.style.setProperty('--sheet-h', SH[shIdx] + 'px'); if (typeof map !== 'undefined' && S.follow && !S.sel && innerWidth < 860) setTimeout(() => map.panTo(visCenter(S.pos), {animate:true, duration:.3}), 60); };
setSheet(0);
(function(){ const g = $('#grab'); let y0, h0;
  g.addEventListener('pointerdown', e => { y0 = e.clientY; h0 = sheet.getBoundingClientRect().height; sheet.classList.add('dragging'); g.setPointerCapture(e.pointerId); });
  g.addEventListener('pointermove', e => { if (y0 == null) return; document.documentElement.style.setProperty('--sheet-h', Math.max(120, h0 + (y0 - e.clientY)) + 'px'); });
  g.addEventListener('pointerup', e => { if (y0 == null) return; sheet.classList.remove('dragging'); const h = h0 + (y0 - e.clientY);
    if (Math.abs(y0 - e.clientY) < 6) setSheet(shIdx === 0 ? 1 : 0); else setSheet(SH.reduce((b, v, i) => Math.abs(v - h) < Math.abs(SH[b] - h) ? i : b, 0)); y0 = null; });
})();
const expand = () => { if (innerWidth < 860 && shIdx === 0) setSheet(1); };

const TABS = [['cerca','Cerca'], ['movilidad','Movilidad'], ['alertas','Alertas'], ['aportes','Mis aportes']];

const src = (real, sim) => real ? `<div class="src real"><i></i>${real}</div>` : `<div class="src sim"><i></i>${sim || 'Dato simulado para el prototipo'}</div>`;

  <span class="tx"><span class="t">${esc(o.titulo)}</span><span class="s"><span class="pill ${EST_OBRA[o.estado][1]}">${EST_OBRA[o.estado][0]}</span> ${esc(o.barrio)}</span></span><span class="r">${distTxt(d)}</span></button>`;

const rowPP = (o, d) => `<button class="row" data-open="pp:${o.id}"><span class="ic" style="background:var(--sol-soft);color:var(--warn)">${ICON.pp}</span>

const rowParada = (s, d, live) => `<button class="row" data-open="parada:${s.num}"><span class="ic" style="background:var(--celeste-soft);color:var(--celeste)">${ICON.bus}</span><span class="tx"><span class="t">Parada N° ${s.num}</span><span class="s"><span class="lines">${s.lineas.slice(0,5).map(lnChip).join('')}</span></span></span>

const rowCorte = (c, d) => `<button class="row" data-open="corte:${c.id}"><span class="ic" style="background:var(--crit-soft);color:var(--crit)">${ICON.corte}</span><span class="tx"><span class="t">${c.tipo === 'total' ? 'Corte total' : 'Reducción de calzada'}: ${esc(c.motivo)}</span><span class="s">${esc(c.horario)} · hasta ${fmtFecha(c.hasta)}${c.lineas_desviadas.length ? ' · desvía ' + c.lineas_desviadas.length + ' líneas' : ''}</span></span><span class="r">${fmtM(d)}</span></button>`;

function radarHead(){
  const A = S.A, n = k => A[k].length;
  const opts = [200, 350, 700, 1200];
  return `<div class="radar"><div class="lbl">${S.follow ? 'A tu alrededor' : 'Alrededor del punto explorado'}<small>Radio de ${fmtM(R())} · vas ${MODO[S.mode]}</small></div>
    <div class="rchips" role="group" aria-label="Radio">${opts.map(o => `<button data-r="${o}" aria-pressed="${R() === o}">${fmtM(o)}</button>`).join('')}</div></div>
    <div class="counts"><span><i style="background:#5b4bc4"></i><b>${n('oreal') + n('obras')}</b> obras</span><span><i style="background:#e8a600"></i><b>${n('pp')}</b> PP</span>
    <span><i style="background:#2a86c4"></i><b>${n('paradas')}</b> paradas</span><span><i style="background:#0f8a83"></i><b>${n('bicis')}</b> bicis</span><span><i style="background:#c8372d"></i><b>${n('reclamos')}</b> reclamos</span></div>`;
}
function liveArrTxt(v){ if (!v || !v.length) return 'Sin arribos'; const best = v.flatMap(l => l.arribos.slice(0,1).map(a => [l.linea, a.min])).sort((a,b) => a[1]-b[1])[0]; return best ? `<b>${best[1]}'</b>${esc(best[0])}` : 'Sin arribos'; }
async function fillArr(s){
  try { const v = await arribosReales(s.num); const el = document.getElementById('arr-' + s.num); if (el) el.innerHTML = `${liveArrTxt(v)}<br><span class="live">En vivo</span>`; }
  catch(e) { const el = document.getElementById('arr-' + s.num); if (el){ const a = s.lineas.slice(0,3).map(l => [l, arribosSim(s, l)[0]]).sort((x,y) => x[1]-y[1])[0]; el.innerHTML = a ? `<b>${a[1]}'</b>${esc(lnLabel(a[0]))}<br><span class="est">Estimado</span>` : ''; } }
}

function render(){
  renderTabs();
  const B = $('#body');
  if (!S.view) clearSel();
  if (S.view) return renderView(B);
  if (!S.A) drawAround();
  const A = S.A, p = S.follow ? S.pos : S.focus;
  if (S.tab === 'cerca'){
    let h = radarHead();
    const al = A.cortes.filter(x => afectaModo(x.o));
    if (al.length) h += `<div class="sec">Atención ${MODO[S.mode]}</div>` + al.slice(0,2).map(x => rowCorte(x.o, x.d)).join('');
    h += `<div class="sec">Movilidad ahora</div>`;
    const st = A.paradas[0], bc = A.bicis[0];
    if (st) h += rowParada(st.o, st.d); if (bc) h += rowBici(bc.o, bc.d);
    if (!st && !bc) h += `<div class="empty">No hay paradas ni estaciones de bici en este radio. Probá ampliarlo.</div>`;
    const zona = [...A.pp.map(x => ({...x, k:'pp'})), ...A.oreal.map(x => ({...x, k:'oreal'})), ...A.obras.map(x => ({...x, k:'obra'}))].sort((a,b) => a.d - b.d);
    h += `<div class="sec">Obras y proyectos en tu zona</div>`;
    h += zona.length ? zona.slice(0, 8).map(x => x.k === 'pp' ? rowPP(x.o, x.d) : x.k === 'oreal' ? rowOreal(x.o, x.d) : rowObra(x.o, x.d)).join('') : `<div class="empty">No hay obras ni proyectos del Presupuesto Participativo en ${fmtM(R())}.</div>`;
    if (A.reclamos.length) h += `<div class="sec">Reclamos de vecinos cerca</div>` + A.reclamos.slice(0, 3).map(x => rowRec(x.o, x.d)).join('');
    h += `<p class="kbd">Tocá el mapa para caminar hasta ese punto${matchMedia('(pointer:fine)').matches ? ' o usá las flechas del teclado' : ''}. Arrastrá el mapa para explorar otra zona.</p>`;
    B.innerHTML = h;
    if (st) fillArr(st.o);
  } else if (S.tab === 'movilidad'){
    const ss = A.paradas.slice(0, 6), bs = alrededor(p, Math.max(R(), 1200)).bicis.slice(0, 4);
    B.innerHTML = radarHead() + `<div class="sec">Paradas de colectivo <span>Cuándo Llega</span></div>` + (ss.length ? ss.map(x => rowParada(x.o, x.d)).join('') : '<div class="empty">No hay paradas en este radio.</div>')
      + `<div class="sec">Mi Bici Tu Bici</div>` + (bs.length ? bs.map(x => rowBici(x.o, x.d)).join('') : '<div class="empty">No hay estaciones a menos de 1,2 km.</div>');

      + `<p class="src sim" style="margin-top:12px"><i></i>Vas ${MODO[S.mode]}: te avisamos a ${fmtM(ALERTA_MODO[S.mode])} de los cortes que te afectan.</p>`;

        : `<div class="card" style="margin:4px 0 8px"><b>Estás sin cuenta.</b> <span style="font-size:13px;color:var(--ink-2)">Para reclamar, opinar o validar obras tenés que ingresar.</span><div class="btns"><button class="btn pri" id="goLogin">Ingresar</button></div></div>`)
      + `<div class="sec">Lo que aportaste</div>` + (S.mine.length ? S.mine.slice().reverse().map(m => `<div class="row"${m.kind === 'opinion' ? ` data-open="pp:${esc(m.ref)}"` : ''}><span class="ic" style="background:var(--celeste-soft);color:var(--celeste)">${m.kind === 'ajuste' ? ICON.cam : m.kind === 'valida' ? ICON.obra : m.kind === 'opinion' || m.kind === 'voto' ? ICON.pp : ICON.otro}</span><span class="tx"><span class="t">${esc(m.titulo)}</span><span class="s">${{reclamo:'Reclamo nuevo', sumado:'Te sumaste a un reclamo', ajuste:'Ajuste de obra enviado', valida:'Validaste una obra', opinion:'Opinaste sobre un proyecto del PP', voto:'Diste tu apoyo a un proyecto del PP'}[m.kind]}${m.ticket ? ' · ' + esc(m.ticket) : ''}</span></span></div>`).join('')
      : '<div class="empty">Todavía no aportaste nada. Reportá un problema con el botón rojo, opiná sobre un proyecto del Presupuesto Participativo o recorré la ciudad para validar obras.</div>');
    const gl = $('#goLogin'); if (gl) gl.onclick = () => authOpen();
  }
  B.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { S.radio = +b.dataset.r; drawAround(); render(); });
  B.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openRef(b.dataset.open));

function openRef(ref){ const [k, id] = ref.split(':');

    if (fin) h += ajustarCard();

const ajustarCard = () => `<div class="card" style="margin-top:10px"><b>¿Ves algo mal en esta obra?</b><div style="font-size:13px;color:var(--ink-2)">Si quedó inconclusa o ya tiene fallas, mandá una foto. Llega al área responsable con la ubicación exacta.</div><div class="btns"><button class="btn red" id="ajustar">${ICON.cam}Ajustar / corregir</button></div></div>`;
async function loadParada(s){
  const L_ = $('#arrList'), st = $('#arrState'); if (!L_) return;

    const v = await arribosReales(s.num);
    if (!document.getElementById('arrList')) return;
    st.innerHTML = '<span class="live">En vivo</span>';

      : '<span class="empty">No hay colectivos informados para esta parada ahora.</span>';

    v.forEach(l => l.arribos.slice(0,1).forEach(a => { if (a.lat && a.lon) L.marker([a.lat, a.lon], {icon:L.divIcon({className:'', html:`<div class="mk bus" style="height:20px">${esc(lnLabel(l.linea))}</div>`, iconSize:[34,20], iconAnchor:[17,10]}), title:`Línea ${l.linea}, llega en ${a.min} min`, zIndexOffset:600}).addTo(lay.buses); }));

    if (!document.getElementById('arrList')) return;
    st.innerHTML = '<span class="est">Estimado</span>';
    L_.innerHTML = s.lineas.map(l => { const a = arribosSim(s, l); return `${lnChip(l)}<span class="s">sin conexión a Cuándo Llega</span><span class="m">${a[0]}' <small>y ${a[1]}'</small></span>`; }).join('');

}
function showLine(id){
  lay.linea.clearLayers(); const L_ = lines[id]; if (!L_) return;
  const col = /Roja/.test(id) ? '#c8372d' : /Verde/.test(id) ? '#1f8a4c' : '#2a86c4';
  L_.ida.forEach(s => L.polyline(s, {color:col, weight:5, opacity:.85}).addTo(lay.linea));
  L_.vuelta.forEach(s => L.polyline(s, {color:col, weight:3, opacity:.6, dashArray:'6 6'}).addTo(lay.linea));

function sumarme(r){

  if (S.mine.some(m => m.ref === r.id)) return toast('Ya estabas sumado a este reclamo.');
  r.adhesiones++; addMine({kind:'sumado', ref:r.id, titulo:r.titulo}); drawAround(); toast(`Te sumaste. Ahora son ${r.adhesiones + 1} vecinos.`);

function photoField(id){ return `<label class="photo"><input type="file" id="${id}" accept="image/*" capture="environment"><span class="th" id="${id}-th">${ICON.cam}</span><span><b>Sacar o elegir foto</b><br><span style="font-size:12.5px;color:var(--ink-2)">Ayuda a la cuadrilla</span></span></label>`; }
function bindPhoto(id){ const f = $('#' + id); if (!f) return; f.onchange = () => { const file = f.files[0]; if (!file) return; const r = new FileReader(); r.onload = () => { const th = $('#' + id + '-th'); th.style.backgroundImage = `url(${r.result})`; th.innerHTML = ''; S.view.photo = true;

// si el elemento del tipo elegido (columna, contenedor, semáforo) está a menos de 35-45 m, el reclamo se ata a ese elemento
function elemCercano(tipo, p){ const E = ELEM[tipo]; if (!E) return null; const c = query(E.ix, p, 50).map(i => [i, dist(p, E.arr[i])]).sort((a,b) => a[1]-b[1])[0]; return c && c[1] < 45 ? {key:E.pre + c[0], at:E.arr[c[0]].slice(0,2), d:c[1]} : null; }
function renderReport(B){

  } else if (v.step === 3){

  if (!SIM_OP.has(o.id)){

}
async function calcRuta(){
  const at = S.sel.at, key = S.sel.key, from = S.pos.slice(), out = $('#navOut');
  if (out) out.innerHTML = '<p class="navsum">Calculando la ruta…</p>';
  let nav;
  try {
    const r = await osrm(from, at);
    const pasos = [];
    for (const s of r.legs[0].steps){ const t = pasoTxt(s); if (pasos.length && pasos[pasos.length - 1].t === t) pasos[pasos.length - 1].d += s.distance; else pasos.push({t, d:s.distance}); }
    nav = {pts:r.geometry.coordinates.map(c => [c[1], c[0]]), dist:r.distance, pasos, real:true};
  } catch(e) {
    const d = dist(from, at);
    nav = {pts:[], dist:d, pasos:[{t:`Andá hacia el ${cardinal(bearing(from, at))}`, d}, {t:'Llegaste a destino', d:0}], real:false};
  }
  if (S.sel?.key !== key) return;                    // el usuario ya abrió otra cosa
  nav.pts = [from, ...nav.pts, at]; nav.key = key; S.nav = nav;
  if (innerWidth < 860) setSheet(0);                 // en el celu se achica el panel para ver la ruta
  lay.nav.clearLayers();
  L.polyline(nav.pts, {color:'#fff', weight:10, opacity:.9, lineCap:'round', lineJoin:'round', interactive:false}).addTo(lay.nav);
  L.polyline(nav.pts, {color:'#1d6fd6', weight:6, opacity:.95, lineCap:'round', lineJoin:'round', interactive:false, dashArray: nav.real ? null : '2 10'}).addTo(lay.nav);
  map.flyToBounds(L.polyline(nav.pts).getBounds(), {...padVista(), duration:.6});
  showNav();
}
function showNav(quiet){
  const n = S.nav, out = $('#navOut'); if (!n || !out) return;
  const verbo = {peaton:'a pie', bici:'en bici', auto:'en auto'}[S.mode];
  out.innerHTML = `<p class="navsum"><b>${fmtM(n.dist)}</b> · unos ${fmtMin(n.dist / VEL[S.mode])} ${verbo}${n.real ? '' : '<br><small style="color:var(--ink-2)">No pudimos calcular la ruta por calles, así que te marcamos la dirección en línea recta.</small>'}</p>
    <ol class="steps">${n.pasos.map((s, i) => `<li><i>${i + 1}</i><span>${esc(s.t)}</span><small>${s.d ? fmtM(s.d) : ''}</small></li>`).join('')}</ol>
    <div class="btns"><button class="btn pri" id="navSim">${n.sim ? 'Detener recorrido' : S.gps != null ? 'Seguir con mi GPS' : 'Simular recorrido'}</button><button class="btn sec2" id="navOff">Quitar ruta</button></div>`;
  $('#navSim').onclick = () => n.sim ? stopNavSim() : S.gps != null ? (setFollow(true), map.setView(visCenter(S.pos, 17), 17), toast('Seguí la línea azul: el mapa te va siguiendo con el GPS.')) : simRuta();
  $('#navOff').onclick = () => { stopNavSim(); S.nav = null; lay.nav.clearLayers(); out.innerHTML = ''; const g = $('#navGo'); if (g) g.textContent = 'Cómo llegar'; };
  const g = $('#navGo'); if (g) g.textContent = 'Ver ruta';
  if (!quiet) out.scrollIntoView({block:'nearest', behavior:'smooth'});
}
function stopNavSim(){ if (S.nav?.sim){ S.nav.sim = false; clearInterval(walkT); const b = $('#navSim'); if (b) b.textContent = 'Simular recorrido'; } }
function simRuta(){
  const n = S.nav; if (!n) return;
  clearInterval(walkT); if (demo.on) demoStop(); setFollow(true);
  let i = 0; const pts = n.pts.slice(); pts[0] = S.pos.slice();          // arranca desde donde estás ahora
  const step = S.mode === 'auto' ? 38 : S.mode === 'bici' ? 20 : 10;
  n.sim = true; if (innerWidth < 860) setSheet(0); showNav(true); toast('Simulando el recorrido. Los avisos aparecen como si fueras yendo.');
  map.setView(visCenter(S.pos, 17), 17);
  walkT = setInterval(() => {
    let left = step, cur = S.pos.slice();
    while (left > 0 && i < pts.length - 1){
      const nx = pts[i + 1], d = dist(cur, nx);
      if (d <= left){ left -= d; cur = nx.slice(); i++; } else { const f = left / d; cur = [cur[0] + (nx[0] - cur[0]) * f, cur[1] + (nx[1] - cur[1]) * f]; left = 0; }
    }
    setPos(cur);
    if (i >= pts.length - 1){ clearInterval(walkT); n.sim = false; toast('Llegaste a destino.'); showNav(true); }
  }, 140);
}

};
try { if (localStorage.getItem('mdr-panel-off') && innerWidth >= 860) $('#shtog').click(); } catch(e) {}
